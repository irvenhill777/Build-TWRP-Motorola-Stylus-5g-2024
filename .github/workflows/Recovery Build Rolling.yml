name: Boston Recovery without FBE + Rolling Release

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "TWRP manifest repository"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp"
        type: string

      MANIFEST_BRANCH:
        description: "TWRP manifest branch"
        required: true
        default: "twrp-12.1"
        type: string

      DEVICE_TREE_URL:
        description: "Boston TWRP device tree"
        required: true
        default: "https://github.com/PizzaG/android_device_motorola_boston"
        type: string

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "TWRP"
        type: string

permissions:
  contents: write

concurrency:
  group: boston-recovery-rolling
  cancel-in-progress: false

jobs:
  build:
    name: Build Boston TWRP Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}

      DEVICE_PATH: device/motorola/boston
      DEVICE_NAME: boston
      LUNCH_TARGET: twrp_boston-eng
      BUILD_TARGET: recoveryimage

      RELEASE_TAG: boston-no-fbe-rolling
      USE_CCACHE: "0"
      ALLOW_MISSING_DEPENDENCIES: "true"
      LC_ALL: C

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Display build configuration
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          echo "Device: Motorola Moto G Stylus 5G 2024"
          echo "Model: XT2419-1"
          echo "Codename: Boston"
          echo "Manifest: $MANIFEST_URL"
          echo "Manifest branch: $MANIFEST_BRANCH"
          echo "Device tree: $DEVICE_TREE_URL"
          echo "Device tree branch: $DEVICE_TREE_BRANCH"
          echo "Lunch target: $LUNCH_TARGET"
          echo "Build target: $BUILD_TARGET"
          echo "Recovery decryption support: not enabled by this workflow"

          df -h
          free -h

      - name: Free runner disk space
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL

          docker image prune --all --force || true
          sudo apt-get clean

          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python3-pip \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            wget \
            xsltproc \
            zip \
            zlib1g-dev \
            libbz2-dev \
            libffi-dev \
            libreadline-dev \
            libsqlite3-dev

          git lfs install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Python 2.7 compatibility
        run: |
          set -euo pipefail

          cd /tmp

          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz

          tar -xzf Python-2.7.18.tgz

          cd Python-2.7.18

          ./configure \
            --prefix=/usr/local \
            --enable-unicode=ucs4

          make -j2

          sudo make altinstall

          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2.7

          python2.7 --version
          python3 --version

      - name: Configure swap
        run: |
          set -euo pipefail

          if ! swapon --show=NAME --noheadings | grep -qx /swapfile-boston; then
            sudo fallocate -l 12G /swapfile-boston
            sudo chmod 600 /swapfile-boston
            sudo mkswap /swapfile-boston
            sudo swapon /swapfile-boston
          fi

          free -h

      - name: Install Repo tool
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Initialize TWRP source
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/android"

          cd "$GITHUB_WORKSPACE/android"

          git config --global user.name "Boston Recovery Builder"
          git config --global user.email "actions@github.com"

          repo init \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH" \
            --depth=1

      - name: Sync TWRP source
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android"

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Clone Boston device tree
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android"

          mkdir -p "$DEVICE_PATH"

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_PATH"

          echo "Boston device tree installed."

      - name: Install device tree dependencies
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android"

          DEPENDENCY_FILE="$DEVICE_PATH/twrp.dependencies"

          if [ -f "$DEPENDENCY_FILE" ]; then
            python3 - "$DEPENDENCY_FILE" <<'PY'
          import json
          import os
          import subprocess
          import sys

          with open(sys.argv[1], "r") as f:
              dependencies = json.load(f)

          for dep in dependencies:
              remote = dep.get("remote")
              repository = dep.get("repository")
              branch = dep.get("branch")
              target = dep.get("target_path")

              if not repository or not target:
                  raise SystemExit("Invalid dependency entry: " + str(dep))

              url = repository

              if remote and not url.startswith(("http://", "https://", "git@")):
                  url = remote.rstrip("/") + "/" + repository

              if not url.startswith(("http://", "https://", "git@")):
                  url = "https://github.com/" + url

              os.makedirs(os.path.dirname(target), exist_ok=True)

              command = ["git", "clone", "--depth=1"]

              if branch:
                  command += ["--branch", branch]

              command += [url, target]

              subprocess.run(command, check=True)

              print("Installed dependency:", target)
          PY
          else
            echo "No twrp.dependencies file found."
          fi

      - name: Verify Boston build configuration
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android"

          test -f "$DEVICE_PATH/Android.mk" || \
            test -f "$DEVICE_PATH/Android.bp"

          echo "Checking recovery configuration..."

          find "$DEVICE_PATH" -maxdepth 2 \
            -type f \
            \( -name "BoardConfig.mk" \
            -o -name "BoardConfigCommon.mk" \
            -o -name "AndroidProducts.mk" \
            -o -name "twrp_boston.mk" \
            -o -name "omni_boston.mk" \) \
            -print

          echo "Device tree verification completed."

      - name: Set up build environment
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android"

          source build/envsetup.sh

          lunch "$LUNCH_TARGET"

      - name: Build Boston recovery image
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android"

          source build/envsetup.sh

          lunch "$LUNCH_TARGET"

          mka "$BUILD_TARGET" -j2

      - name: Locate recovery image
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/android"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          RECOVERY_IMAGE="$(find out/target/product/boston \
            -type f \
            -name recovery.img \
            -print -quit)"

          if [ -z "$RECOVERY_IMAGE" ]; then
            echo "ERROR: recovery.img was not generated."
            find out/target/product/boston -maxdepth 2 -type f || true
            exit 1
          fi

          cp "$RECOVERY_IMAGE" \
            "$GITHUB_WORKSPACE/artifacts/recovery-boston.img"

          sha256sum \
            "$GITHUB_WORKSPACE/artifacts/recovery-boston.img" \
            > "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"

          echo "Recovery image generated successfully."

      - name: Generate build information
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/artifacts/BUILD-INFO.txt" <<EOF
          Device: Motorola Moto G Stylus 5G 2024
          Model: XT2419-1
          Codename: Boston
          Recovery: TWRP
          Android Base: 12.1
          Manifest: $MANIFEST_URL
          Manifest Branch: $MANIFEST_BRANCH
          Device Tree: $DEVICE_TREE_URL
          Device Tree Branch: $DEVICE_TREE_BRANCH
          Build Target: $BUILD_TARGET
          Release: Rolling
          Recovery Decryption: Not enabled by workflow
          EOF

      - name: Upload recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Boston-TWRP-Recovery
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: boston-no-fbe-rolling
          name: Boston Recovery - Rolling Release
          body: |
            Unofficial TWRP recovery build for Motorola Moto G Stylus 5G 2024.

            Device: Boston
            Model: XT2419-1
            Android base: TWRP 12.1

            Recovery image:
            recovery-boston.img

            Verify SHA256SUMS.txt before flashing.

            IMPORTANT:
            Check device compatibility and partition layout
            before flashing this recovery.

            Recovery decryption is not enabled by this workflow.
          files: |
            artifacts/recovery-boston.img
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}