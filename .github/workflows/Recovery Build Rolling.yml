name: Boston Recovery without FBE + Rolling Release

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "TWRP manifest repository"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp"
        type: string

      MANIFEST_BRANCH:
        description: "TWRP manifest branch"
        required: true
        default: "twrp-12.1"
        type: string

      DEVICE_TREE_URL:
        description: "Boston TWRP device tree"
        required: true
        default: "https://github.com/PizzaG/android_device_motorola_boston"
        type: string

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "TWRP"
        type: string

permissions:
  contents: write

concurrency:
  group: boston-recovery-rolling
  cancel-in-progress: false

jobs:
  build:
    name: Build Boston recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: device/motorola/boston
      DEVICE_NAME: boston
      LUNCH_TARGET: twrp_boston-eng
      BUILD_TARGET: recoveryimage
      RELEASE_TAG: boston-no-fbe-rolling
      USE_CCACHE: "0"
      ALLOW_MISSING_DEPENDENCIES: "true"
      LC_ALL: C

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Display configuration
        run: |
          set -euo pipefail
          printf '%s
' \
            "Device: Motorola Moto G Stylus 5G 2024" \
            "Model: XT2419-1" \
            "Codename: $DEVICE_NAME" \
            "Manifest: $MANIFEST_URL" \
            "Manifest branch: $MANIFEST_BRANCH" \
            "Device tree: $DEVICE_TREE_URL" \
            "Device tree branch: $DEVICE_TREE_BRANCH" \
            "Lunch target: $LUNCH_TARGET" \
            "Build target: $BUILD_TARGET" \
            "Recovery decryption: disabled"
          df -h
          free -h

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            wget \
            xsltproc \
            zip \
            zlib1g-dev
          git lfs install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Configure swap
        run: |
          set -euo pipefail
          if ! swapon --show=NAME --noheadings | grep -qx /swapfile-boston; then
            sudo fallocate -l 12G /swapfile-boston
            sudo chmod 600 /swapfile-boston
            sudo mkswap /swapfile-boston
            sudo swapon /swapfile-boston
          fi
          free -h
          df -h

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure Git
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

      - name: Initialize source
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          cd "$GITHUB_WORKSPACE/workspace"
          repo init \
            --depth=1 \
            --no-clone-bundle \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH"

      - name: Sync source
        working-directory: workspace
        run: |
          set -euo pipefail
          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            -j4

      - name: Clone Boston device tree
        working-directory: workspace
        run: |
          set -euo pipefail

          if [[ -e "$DEVICE_PATH" ]]; then
            echo "::error::Device path already exists: $DEVICE_PATH"
            exit 1
          fi

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_PATH"

          git -C "$DEVICE_PATH" lfs pull

          test -f "$DEVICE_PATH/BoardConfig.mk"
          test -f "$DEVICE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_PATH/twrp_boston.mk"

          DEVICE_COMMIT="$(git -C "$DEVICE_PATH" rev-parse HEAD)"
          echo "DEVICE_COMMIT=$DEVICE_COMMIT" >> "$GITHUB_ENV"

      - name: Disable recovery crypto and FBE support
        working-directory: workspace
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          board = Path(os.environ["DEVICE_PATH"]) / "BoardConfig.mk"
          text = board.read_text()

          settings = {
              "TW_INCLUDE_CRYPTO": "false",
              "TW_INCLUDE_CRYPTO_FBE": "false",
              "TW_INCLUDE_FBE_METADATA_DECRYPT": "false",
              "BOARD_USES_QCOM_FBE_DECRYPTION": "false",
          }

          for name in settings:
              text = re.sub(
                  rf"^[ \t]*{re.escape(name)}[ \t]*"
                  rf"(?::=|?=|+=|=)[^
]*(?:
|$)",
                  "",
                  text,
                  flags=re.MULTILINE,
              )

          text = re.sub(
              r"^[ \t]*TW_USE_FSCRYPT_POLICY[ \t]*"
              r"(?::=|?=|+=|=)[^
]*(?:
|$)",
              "",
              text,
              flags=re.MULTILINE,
          )

          text += "
# CI build: recovery decryption disabled.
"
          text += "
".join(
              f"{name} := {value}"
              for name, value in settings.items()
          )
          text += "
"
          board.write_text(text)
          PY

          git -C "$DEVICE_PATH" diff -- BoardConfig.mk

      - name: Record source manifest
        working-directory: workspace
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          repo manifest -r \
            -o "$GITHUB_WORKSPACE/artifacts/source-manifest.xml"

      - name: Build recovery
        working-directory: workspace
        run: |
          set -eo pipefail

          # Android environment scripts may reference unset variables.
          set +u
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"

          JOBS="$(nproc)"
          if (( JOBS > 4 )); then
            JOBS=4
          fi

          make "$BUILD_TARGET" -j"$JOBS" 2>&1 \
            | tee "$GITHUB_WORKSPACE/artifacts/build.log"

      - name: Package recovery
        run: |
          set -euo pipefail

          IMAGE="$GITHUB_WORKSPACE/workspace/out/target/product/boston/recovery.img"
          OUTPUT="$GITHUB_WORKSPACE/artifacts"

          if [[ ! -s "$IMAGE" ]]; then
            echo "::error::Expected recovery.img was not produced."
            exit 1
          fi

          cp "$IMAGE" "$OUTPUT/twrp-boston-no-fbe.img"

          (
            cd "$OUTPUT"
            sha256sum twrp-boston-no-fbe.img > SHA256SUMS
          )

          {
            printf 'Device: Moto G Stylus 5G 2024
'
            printf 'Model: XT2419-1
'
            printf 'Codename: boston
'
            printf 'Manifest: %s
' "$MANIFEST_URL"
            printf 'Manifest branch: %s
' "$MANIFEST_BRANCH"
            printf 'Device tree: %s
' "$DEVICE_TREE_URL"
            printf 'Device tree branch: %s
' "$DEVICE_TREE_BRANCH"
            printf 'Device tree commit: %s
' "$DEVICE_COMMIT"
            printf 'Workflow commit: %s
' "$GITHUB_SHA"
            printf 'Run: %s
' "$GITHUB_RUN_ID"
            printf 'Recovery decryption support: disabled
'
            printf '
This build does not disable encryption on the phone.
'
            printf 'Boot and firmware compatibility require device testing.
'
          } > "$OUTPUT/build-info.txt"

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boston-no-fbe-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Experimental TWRP recovery build for:
          - Motorola Moto G Stylus 5G (2024)
          - Model: XT2419-1
          - Codename: boston

          Recovery crypto/FBE decryption support is disabled.
          This does not remove or disable encryption on the phone.
          Encrypted internal storage may remain inaccessible.

          Device tree: $DEVICE_TREE_URL
          Branch: $DEVICE_TREE_BRANCH
          Device tree commit: $DEVICE_COMMIT

          Manifest: $MANIFEST_URL
          Manifest branch: $MANIFEST_BRANCH

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Experimental: successful compilation does not prove boot compatibility.
          Verify firmware compatibility before flashing.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Boston TWRP — No FBE — Rolling" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Boston TWRP — No FBE — Rolling" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/artifacts/twrp-boston-no-fbe.img" \
            "$GITHUB_WORKSPACE/artifacts/SHA256SUMS" \
            "$GITHUB_WORKSPACE/artifacts/build-info.txt" \
            "$GITHUB_WORKSPACE/artifacts/source-manifest.xml" \
            --clobber